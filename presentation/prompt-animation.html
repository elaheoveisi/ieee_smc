<style>
.reveal .prompt-slide .prompt-part { transition: opacity .35s, background-color .35s; border-radius: 3px; }
.reveal .prompt-slide.tour-active .prompt-part { opacity: .35; }
.reveal .prompt-slide.tour-active .prompt-part.is-active { opacity: 1; background: #ffb876; box-shadow: 0 2px 0 #bd490c; }
.reveal .prompt-slide .card { transition: opacity .35s, box-shadow .35s, transform .35s; }
.reveal .prompt-slide.tour-active .card { opacity: .4; }
.reveal .prompt-slide.tour-active .card.is-active { opacity: 1; box-shadow: 0 0 0 3px #ec672c; transform: translateY(-3px); }
.reveal .prompt-slide .prompt-tour { display: flex; align-items: center; gap: 8px; margin-top: 13px; text-align: left; }
.reveal .prompt-slide .prompt-tour button { font: inherit; font-size: 15px; color: #fff; background: #383838; border: 1px solid #777; border-radius: 5px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.reveal .prompt-slide .prompt-tour button:hover, .reveal .prompt-slide .prompt-tour button:focus-visible { border-color: #ffb876; outline: 2px solid #ffb876; }
.reveal .prompt-slide .prompt-tour [data-tour="play"] { background: #a63c12; min-width: 64px; }
.reveal .prompt-slide .prompt-explanation { font-size: 15px; line-height: 1.3; color: #eee; }
@media (prefers-reduced-motion: reduce) {
  .reveal .prompt-slide .prompt-part, .reveal .prompt-slide .card { transition: none; transform: none !important; }
}
@media print {
  .reveal .prompt-slide .prompt-tour { display: none; }
  .reveal .prompt-slide.tour-active .prompt-part, .reveal .prompt-slide.tour-active .card { opacity: 1; background: inherit; box-shadow: none; transform: none; }
}
</style>
<script>
(() => {
  function init() {
    const slide = document.querySelector('.prompt-slide');
    if (!slide || slide.dataset.tourReady) return;
    slide.dataset.tourReady = 'true';
    const parts = [...slide.querySelectorAll('.prompt-part')];
    const cards = [...slide.querySelectorAll('[data-prompt-category]')];
    const caption = slide.querySelector('.prompt-explanation');
    const play = slide.querySelector('[data-tour="play"]');
    const labels = { style: 'Guidance Style', priority: 'Priority', rules: 'Mission Rules' };
    let index = -1;
    let timer = null;
    function pause() { clearTimeout(timer); timer = null; play.textContent = 'Play'; }
    function show(next) {
      index = next;
      slide.classList.toggle('tour-active', index >= 0);
      parts.forEach((part, i) => part.classList.toggle('is-active', i === index));
      cards.forEach(card => card.classList.toggle('is-active', index >= 0 && card.dataset.promptCategory === parts[index].dataset.category));
      caption.textContent = index < 0 ? 'Select Play to explore each part of the prompt.' : `${index + 1}/${parts.length} · ${labels[parts[index].dataset.category]} — ${parts[index].dataset.note}`;
    }
    function schedule() {
      // Give longer passages more reading time. Playback stops on the last section.
      const delay = Math.max(4500, parts[index].textContent.split(/\s+/).length * 230);
      timer = setTimeout(() => {
        if (index === parts.length - 1) { pause(); return; }
        show(index + 1);
        schedule();
      }, delay);
    }
    slide.querySelector('.prompt-tour').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      event.stopPropagation();
      const action = button.dataset.tour;
      if (action === 'play') {
        if (timer !== null) { pause(); return; }
        if (index < 0 || index === parts.length - 1) show(0);
        play.textContent = 'Pause';
        schedule();
      } else {
        pause();
        if (action === 'reset') show(-1);
        if (action === 'next') show(Math.min(parts.length - 1, index + 1));
        if (action === 'previous') show(Math.max(0, index - 1));
      }
    });
    // Keep keyboard activation of controls from advancing the presentation.
    slide.querySelector('.prompt-tour').addEventListener('keydown', event => {
      if ([' ', 'Enter', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.stopPropagation();
    });
    if (window.Reveal) Reveal.on('slidechanged', pause);
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
